name: betgrid_admin
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  equatable: ^3.0.0
  injectable: ^3.0.0
  auto_route: ^11.2.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.0
  flutter_svg: ^2.0.10+1
  rxdart: ^0.28.0
  country_flags: ^4.1.2
  intl: ^0.20.3
  collection: ^1.18.0
  get_it: ^9.3.0
  flutter_localizations:
    sdk: flutter
  mutex: ^3.1.0
  flutter_slidable: ^4.0.3
  betgrid_shared:
    path: ../shared
  firebase_core: ^4.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  build_runner: ^2.4.10
  json_serializable: ^6.7.1
  injectable_generator:
  auto_route_generator: ^10.6.0

flutter:
  default-flavor: dev
  uses-material-design: true
  generate: true

  assets:
     - assets/
