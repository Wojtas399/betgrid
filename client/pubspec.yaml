name: betgrid
description: "A new Flutter project."
publish_to: 'none'

version: 1.8.0+15

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  equatable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  injectable: ^3.0.0
  get_it: ^9.3.0
  auto_route: ^11.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_svg: ^2.0.9
  rxdart: ^0.28.0
  collection: ^1.18.0
  country_flags: ^4.1.2
  syncfusion_flutter_charts: ^35.1.42
  flutter_bloc: ^9.1.1
  mutex: ^3.1.0
  betgrid_shared:
    path: ../shared
  firebase_analytics: ^12.6.1
  flutter_native_splash: ^2.4.5
  image_picker: ^1.1.2
  firebase_crashlytics: ^5.4.1
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  injectable_generator:
  auto_route_generator: ^10.6.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/ic_launcher.png"
  image_path_ios: "assets/ic_launcher_ios.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/ic_launcher_adaptive_back.png"

flutter:
  default-flavor: dev
  uses-material-design: true
  generate: true

  assets:
    - assets/
